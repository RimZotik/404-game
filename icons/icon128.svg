<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" style="stop-color:#2a5298"/>
      <stop offset="100%" style="stop-color:#1e3c72"/>
    </radialGradient>
    <radialGradient id="turretGrad128" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff4757"/>
    </radialGradient>
    <radialGradient id="enemyGrad128" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#26d0ce"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="128" height="128" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Декоративная сетка -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="128" height="128" fill="url(#grid)"/>
  
  <!-- Главная турель -->
  <circle cx="64" cy="64" r="32" fill="url(#turretGrad128)" stroke="#ff3742" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Ствол турели -->
  <rect x="64" y="60" width="25" height="8" fill="#ff3742" rx="4"/>
  <rect x="88" y="62" width="8" height="4" fill="#ff5252" rx="2"/>
  
  <!-- Центр турели -->
  <circle cx="64" cy="64" r="12" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="64" cy="64" r="6" fill="#1a1a1a"/>
  <circle cx="64" cy="64" r="3" fill="#333"/>
  
  <!-- Враги с анимацией -->
  <g opacity="0.9">
    <circle cx="20" cy="20" r="6" fill="url(#enemyGrad128)" stroke="#1dd1cb" stroke-width="2">
      <animate attributeName="cx" values="20;30;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;15;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="108" cy="25" r="6" fill="url(#enemyGrad128)" stroke="#1dd1cb" stroke-width="2">
      <animate attributeName="cx" values="108;98;108" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="25;30;25" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="15" cy="100" r="6" fill="url(#enemyGrad128)" stroke="#1dd1cb" stroke-width="2">
      <animate attributeName="cx" values="15;25;15" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;90;100" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="110" cy="95" r="6" fill="url(#enemyGrad128)" stroke="#1dd1cb" stroke-width="2">
      <animate attributeName="cx" values="110;100;110" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95;105;95" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Текст 404 -->
  <text x="64" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffd700" opacity="0.8">404</text>
  
  <!-- Эффекты свечения -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#ff6b6b" stroke-width="0.5" opacity="0.2"/>
</svg>