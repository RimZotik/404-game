<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="turretGrad48" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff4757"/>
    </radialGradient>
    <radialGradient id="enemyGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#26d0ce"/>
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="48" height="48" fill="url(#turretGrad48)" opacity="0.1" rx="8"/>
  
  <!-- Турель -->
  <circle cx="24" cy="24" r="16" fill="url(#turretGrad48)" stroke="#ff3742" stroke-width="2"/>
  
  <!-- Ствол -->
  <rect x="24" y="22" width="15" height="4" fill="#ff3742" rx="2"/>
  
  <!-- Центр турели -->
  <circle cx="24" cy="24" r="6" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="24" cy="24" r="3" fill="#1a1a1a"/>
  
  <!-- Враги -->
  <circle cx="8" cy="8" r="3" fill="url(#enemyGrad)" stroke="#1dd1cb" stroke-width="1" opacity="0.9">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="12" r="3" fill="url(#enemyGrad)" stroke="#1dd1cb" stroke-width="1" opacity="0.7">
    <animate attributeName="r" values="3;4;3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="6" cy="38" r="3" fill="url(#enemyGrad)" stroke="#1dd1cb" stroke-width="1" opacity="0.8">
    <animate attributeName="r" values="3;4;3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="36" r="3" fill="url(#enemyGrad)" stroke="#1dd1cb" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="3;4;3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Эффект свечения -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
</svg>