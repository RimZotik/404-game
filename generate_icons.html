<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Icon Generator</title>
  </head>
  <body>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas128" width="128" height="128"></canvas>

    <script>
      // Функция для создания иконки 16x16
      function drawIcon16() {
        const canvas = document.getElementById("canvas16");
        const ctx = canvas.getContext("2d");

        // Фон
        ctx.fillStyle = "#2a5298";
        ctx.fillRect(0, 0, 16, 16);

        // Турель
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.arc(8, 8, 6, 0, 2 * Math.PI);
        ctx.fill();

        // Ствол
        ctx.fillStyle = "#ff3742";
        ctx.fillRect(8, 7, 5, 2);

        // Центр
        ctx.fillStyle = "#2c2c2c";
        ctx.beginPath();
        ctx.arc(8, 8, 2, 0, 2 * Math.PI);
        ctx.fill();

        // Враги
        ctx.fillStyle = "#4ecdc4";
        ctx.beginPath();
        ctx.arc(3, 3, 1, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(13, 4, 1, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(2, 12, 1, 0, 2 * Math.PI);
        ctx.fill();
      }

      // Функция для создания иконки 48x48
      function drawIcon48() {
        const canvas = document.getElementById("canvas48");
        const ctx = canvas.getContext("2d");

        // Фон
        const gradient = ctx.createRadialGradient(24, 24, 0, 24, 24, 24);
        gradient.addColorStop(0, "#2a5298");
        gradient.addColorStop(1, "#1e3c72");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 48, 48);

        // Турель
        const turretGrad = ctx.createRadialGradient(24, 24, 0, 24, 24, 16);
        turretGrad.addColorStop(0, "#ff6b6b");
        turretGrad.addColorStop(1, "#ff4757");
        ctx.fillStyle = turretGrad;
        ctx.beginPath();
        ctx.arc(24, 24, 16, 0, 2 * Math.PI);
        ctx.fill();

        // Ствол
        ctx.fillStyle = "#ff3742";
        ctx.fillRect(24, 22, 15, 4);

        // Центр
        ctx.fillStyle = "#2c2c2c";
        ctx.beginPath();
        ctx.arc(24, 24, 6, 0, 2 * Math.PI);
        ctx.fill();

        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath();
        ctx.arc(24, 24, 3, 0, 2 * Math.PI);
        ctx.fill();

        // Враги
        ctx.fillStyle = "#4ecdc4";
        ctx.beginPath();
        ctx.arc(8, 8, 3, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(40, 12, 3, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(6, 38, 3, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(42, 36, 3, 0, 2 * Math.PI);
        ctx.fill();
      }

      // Функция для создания иконки 128x128
      function drawIcon128() {
        const canvas = document.getElementById("canvas128");
        const ctx = canvas.getContext("2d");

        // Фон
        const bgGrad = ctx.createRadialGradient(64, 64, 0, 64, 64, 90);
        bgGrad.addColorStop(0, "#2a5298");
        bgGrad.addColorStop(1, "#1e3c72");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 128, 128);

        // Турель
        const turretGrad = ctx.createRadialGradient(64, 64, 0, 64, 64, 32);
        turretGrad.addColorStop(0, "#ff6b6b");
        turretGrad.addColorStop(1, "#ff4757");
        ctx.fillStyle = turretGrad;
        ctx.beginPath();
        ctx.arc(64, 64, 32, 0, 2 * Math.PI);
        ctx.fill();

        // Ствол
        ctx.fillStyle = "#ff3742";
        ctx.fillRect(64, 60, 25, 8);
        ctx.fillRect(88, 62, 8, 4);

        // Центр
        ctx.fillStyle = "#2c2c2c";
        ctx.beginPath();
        ctx.arc(64, 64, 12, 0, 2 * Math.PI);
        ctx.fill();

        ctx.fillStyle = "#1a1a1a";
        ctx.beginPath();
        ctx.arc(64, 64, 6, 0, 2 * Math.PI);
        ctx.fill();

        // Враги
        ctx.fillStyle = "#4ecdc4";
        ctx.beginPath();
        ctx.arc(20, 20, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(108, 25, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(15, 100, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(110, 95, 6, 0, 2 * Math.PI);
        ctx.fill();

        // Текст 404
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.fillText("404", 64, 110);
      }

      // Создаем и скачиваем иконки
      function generateIcons() {
        drawIcon16();
        drawIcon48();
        drawIcon128();

        // Конвертируем в PNG и выводим base64
        const canvas16 = document.getElementById("canvas16");
        const canvas48 = document.getElementById("canvas48");
        const canvas128 = document.getElementById("canvas128");

        console.log(
          "Иконки созданы. Скопируйте base64 данные из консоли для создания PNG файлов."
        );

        // Создаем download ссылки
        downloadCanvas(canvas16, "icon16.png");
        downloadCanvas(canvas48, "icon48.png");
        downloadCanvas(canvas128, "icon128.png");
      }

      function downloadCanvas(canvas, filename) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      // Автоматически генерируем иконки при загрузке
      generateIcons();
    </script>
  </body>
</html>
